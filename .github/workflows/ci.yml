name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.87
        run: rustup toolchain install 1.87.0 --profile minimal
      - name: Test
        run: cargo +1.87.0 test --locked
      - name: Build release
        run: cargo +1.87.0 build --locked --release
